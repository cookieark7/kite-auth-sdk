[tool.poetry]
name = "kite-auto-sdk"
version = "0.1.0"
description = "Async-first Python SDK scaffold for Zerodha Kite Connect authentication and trading workflows."
authors = ["Kite Auto SDK Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "kite_auto" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27.2"
loguru = "^0.7.2"
playwright = "^1.48.0"
pydantic-settings = "^2.6.1"
pyotp = "^2.9.0"
tenacity = "^9.0.0"
websockets = "^13.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.13.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.2"


[tool.poetry.group.scanner.dependencies]
pandas = "^3.0.5"
pyarrow = "^25.0.0"
pandas-stubs = "^3.0.5.260730"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "RUF",
  "S",
  "UP",
  "W",
]
ignore = [
  "S101",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["kite_auto"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
